services:
  shortener:
    container_name: goshort
    build:
      context: .
      dockerfile: dockerfile
    image: ghcr.io/n0f4ph4mst3r/goshort:latest
    environment:
      HTTP_SERVER_ADDRESS: 0.0.0.0
      HTTP_SERVER_PORT: ${HTTP_SERVER_PORT}
      CONFIG_PATH: /config/config.yaml
      DATABASE_URL: ${DATABASE_URL}
      CACHE_URL: ${CACHE_URL}
      SSO_PUBLIC_KEY_PATH: /sso_public_key.pem
    volumes:
      - ${HOST_CONFIG_PATH}:/config/config.yaml:ro
      - ${HOST_SSO_PUBLIC_KEY_PATH:-/dev/null}:/sso_public_key.pem:ro
    ports:
      - "${HTTP_SERVER_PORT}:${HTTP_SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      outbox:
        condition: service_healthy

  outbox:
    container_name: goshort_outbox
    image: ghcr.io/n0f4ph4mst3r/outbox-relay:latest
    environment:
      CONFIG_PATH: /config/config.yaml
      DATABASE_URL: "${DATABASE_URL}"
      BROKER_URL: "${BROKER_URL}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f outbox-relay"] 
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ${HOST_CONFIG_PATH}:/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
  
  postgres:
    image: postgres:18-alpine
    container_name: goshort_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  redis:
    image: valkey/valkey:8.1.4
    container_name: goshort_cache
    command: ["valkey-server"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 5
  
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    container_name: goshort_broker
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:${BROKER_PORT}
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:${BROKER_PORT}
      - --mode dev-container
      - --smp 1
    ports:
      - "127.0.0.1:${BROKER_PORT}:${BROKER_PORT}" 
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q healthy"]
      start_period: 15s
      interval: 5s
      retries: 5
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    container_name: goshort-topics-init
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      redpanda:
        condition: service_healthy
    command: 
      - "rpk topic create UrlSaved UrlDeleted --brokers redpanda:9092 --partitions 3 --replicas 1 || true"

networks:
  goshort-local-network:
    driver: bridge

volumes:
  pgdata:
  redpanda-data:
