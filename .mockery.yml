all: false
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: false
log-level: info
recursive: false
require-template-schema-exists: true
template: testify
filename: "{{.InterfaceName}}.go"
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: "mocks"

packages:
  github.com/n0f4ph4mst3r/goshort/internal/http-server/handlers/save:
    config:
      dir: "tests/http-server/handlers/save/mocks"
    interfaces:
      AliasGenerator:
      UrlSaver:

  github.com/n0f4ph4mst3r/goshort/internal/http-server/handlers/redirect:
    config:
      dir: "tests/http-server/handlers/redirect/mocks"
    interfaces:
      UrlGetter:

  github.com/n0f4ph4mst3r/goshort/internal/http-server/handlers/erase:
    config:
      dir: "tests/http-server/handlers/erase/mocks"
    interfaces:
      UrlEraser: